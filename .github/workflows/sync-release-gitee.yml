name: sync-release-gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync to Gitee (e.g. v0.4.0)'
        required: true
        type: string

jobs:
  mirror:
    name: Mirror release to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          NAME=$(gh release view "$TAG" --repo "$REPO" --json name -q '.name')
          [ -z "$NAME" ] && NAME="$TAG"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "RELEASE_BODY<<__GITEE_EOF__"
            gh release view "$TAG" --repo "$REPO" --json body -q '.body'
            echo "__GITEE_EOF__"
          } >> "$GITHUB_ENV"

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.zip' \
            --dir assets
          ls -l assets

      - name: Create Gitee release
        uses: nICEnnnnnnnLee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: aisensiy
          gitee_repo: my-bilibili-rcmd
          gitee_token: ${{ secrets.GITEE_API_TOKEN }}
          gitee_tag_name: ${{ steps.meta.outputs.tag }}
          gitee_release_name: ${{ steps.meta.outputs.name }}
          gitee_release_body: ${{ env.RELEASE_BODY }}
          gitee_target_commitish: master
          gitee_files: assets/*.zip
