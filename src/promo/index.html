<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Bilibili Recommend — Promo</title>
  <style>
    /* NOTE: do NOT put `* { padding: 0 }`-style reset here. Rules outside
       @layer always win over Tailwind's utility classes (which live in
       @layer utilities), so a universal reset would silently kill every
       `py-*` / `px-*` on the popup. extension/index.css imports Tailwind's
       preflight which handles the reset properly. */
    html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
    body {
      color: #171b26;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
